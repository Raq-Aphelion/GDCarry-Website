# Orders proxy worker — deploys orders-proxy.js and bundles the pricing
# engine it imports from ../src (wrangler builds with esbuild; no separate
# build step needed).
#
# Deploy (from the repo root):
#   npx wrangler deploy --config worker/wrangler.toml
#
# One-time setup:
#   npx wrangler kv namespace create RATE_LIMIT --config worker/wrangler.toml
#     → paste the returned id into [[kv_namespaces]] below
#   Create a Turnstile widget: Cloudflare dashboard → Turnstile → Add site
#     (hostname gdcarry.com; add localhost for dev) → copy the SITE key into
#     turnstileSiteKey in site.config.json (repo root), then:
#   npx wrangler secret put TURNSTILE_SECRET_KEY --config worker/wrangler.toml
#     (paste the widget's SECRET key — it lives only in Cloudflare; rotation is
#     a dashboard/wrangler action, no client deploy needed)
#   npx wrangler secret put DISCORD_WEBHOOK_URL --config worker/wrangler.toml
#   CSP (set in Cloudflare) must allow challenges.cloudflare.com in
#   script-src, frame-src and connect-src for the widget to run.
#   Local dev without secrets: worker skips verification (warns); use
#   Cloudflare's always-pass test site key 1x00000000000000000000AA client-side.
#
# The name matches the existing dashboard-created worker, so the first
# wrangler deploy adopts it (the cluwners.workers.dev hostname is disabled
# below — the zone route replaces it).

name = "orders-proxy"
main = "orders-proxy.js"
compatibility_date = "2025-01-01"

# Serve only via the zone routes: the site-wide flood rate-limit rule covers
# them, and the unprotected *.workers.dev hostname goes away.
workers_dev = false
routes = [
  { pattern = "gdcarry.com/api/order", zone_name = "gdcarry.com" },
  { pattern = "gdcarry.com/api/apply", zone_name = "gdcarry.com" },
]

# Domain-dependent config, read from env in orders-proxy.js. Duplicated from
# site.config.json (the worker can't import that JSON at the toml level) —
# KEEP THE TWO FILES IN SYNC. The http://localhost:3000 origin is the vite
# dev server (see vite.config.ts server.port).
[vars]
SITE_URL = "https://gdcarry.com"
CHAT_URL = "https://chat.gdcarry.com/index.php/"
DB_URL = "https://gdcarry.com/db/"
ALLOWED_ORIGINS = "https://gdcarry.com,https://www.gdcarry.com,http://localhost:3000"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "738bd81f74424da5804a50b114fa3848"
